# Chains that recur, as control structure rather than prose.

pre-merge:
  pattern: linear
  when: "a change is ready to land"
  chain: [quality-review, quality-test, quality-gate]
  gate: "criteria are fixed before evaluation; required evidence is acquired before the gate decides, not before intake"

close-the-gap:
  pattern: linear
  when: "a review named behaviour that nothing verifies"
  chain: [quality-test]

broken-again:
  pattern: linear
  when: "something that passed now fails"
  chain: [quality-regression, quality-test]
  gate: "the failure is reproduced before a guard is written"

unreliable-suite:
  pattern: linear
  when: "the suite fails without a change"
  chain: [quality-regression, quality-metrics]

baseline:
  pattern: report-only
  when: "is this getting better or worse"
  chain: [quality-metrics]
  stops_at: "snapshots with their extraction commands, and the trend. Nothing is proposed"

what-first:
  pattern: linear
  when: "there is more rot than time"
  chain: [quality-metrics, quality-debt]
  gate: "every interest score names the number it came from"

ship-decision:
  pattern: report-only
  when: "can this go out"
  chain: [quality-gate]
  gate: "intake reads current payloads and invokes only missing or stale evidence owners from capabilities.yaml; gate never produces that evidence"
  stops_at: "after acquisition: the verdict, its conditions and evidence; unobtainable required evidence yields NO-GO (insufficient evidence)"

review-to-zero:
  pattern: loop
  when: "close every blocking finding before this lands"
  chain: [quality-review, quality-test]
  # Nothing in the chain applies a fix (OPERATIONAL.md §1): between cycles the
  # implementer acts on the fix directives, outside the pack. Without that step
  # the loop cannot converge, so it waits for it rather than re-reviewing.
  between: "the implementer applies the fix directives; a cycle with no new commit stops the loop"
  oracle: "no blocking finding remains, and one full pass adds none"
  checker: other-engine          # resolved at run time to one that is not running this
  max_cycles: 4
  on_limit: "stop; the remaining BLOCK findings are reported, and the status is PARTIAL"
