name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # The same set as `make check` and the pre-commit hook, one step per tool
      # so a failure names which.
      - name: Static rules
        run: python3 quality-tools/validate.py
      - name: Every rule still fires
        run: python3 quality-tools/test_validate.py
      - name: Acquisition ownership
        run: python3 quality-tools/test_acquisition_routes.py
      - name: Figures re-derived
        run: python3 quality-tools/figures_check.py
      - name: No delivery drift
        run: python3 quality-tools/render.py --check
      - name: Delivered blocks are current
        run: |
          python3 quality-tools/render.py
          git diff --exit-code || {
            echo "SKILL.md delivery blocks are stale — run: make render"; exit 1; }
